%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/qcom/qcom,wear-config.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm Technologies, Inc. Wear Configuration driver

maintainers:
  - Koushik Immadisetty <kimmadis@qti.qualcomm.com>

description: |
  Wear configuration platform driver that provides a stable
  sysfs class interface between userspace and kernel subsystems.

properties:
  compatible:
    const: qcom,wear-config

  nvmem-cells:
    description: phandle to the nvmem cell to be accessed

  nvmem-cell-names:
    description: name of the nvmem cell referenced above
    const: logo-orientation

required:
  - compatible
  - nvmem-cells
  - nvmem-cell-names

additionalProperties: false

examples:
  - |
    wear-config {
        compatible = "qcom,wear-config";
        nvmem-cells = <&logo_orientation>;
        nvmem-cell-names = "logo-orientation";
    };
